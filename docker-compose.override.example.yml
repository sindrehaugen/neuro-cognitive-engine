# NCE v3.4.2 — Local Development docker-compose override template.
#
# Copy this file to 'docker-compose.override.yml' in the project root to enable
# developer-friendly customizations for local development (single-replica CPU defaults,
# live source mounts, debug logging, and direct localhost service ports):
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   make up   # or: python scripts/bootstrap-compose-secrets.py && docker compose up -d
#
# Default host ports from docker-compose.yml:
#   5432 Postgres · 27017 MongoDB · 6379 Redis · 9002 MinIO S3 · 9003 MinIO Console
#   8003 admin · 8004 a2a · 8005 mcp-gateway · 8080 webhook-receiver · 8082/8443 Caddy

services:
  # 1. Single-Replica Local Development Worker Override
  # Scales RQ background workers down to 1 replica for lower local RAM/CPU footprint
  # and mounts local source files so edits are picked up on `docker compose restart worker`.
  worker:
    volumes:
      - ./nce:/app/nce
      - ./start_worker.py:/app/start_worker.py
    environment:
      NCE_ENV: dev
      LOG_LEVEL: DEBUG
    deploy:
      replicas: 1

  # 2. Expose Backing Datastores Exclusively on Loopback (127.0.0.1)
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  mongodb:
    ports:
      - "127.0.0.1:27017:27017"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    ports:
      - "127.0.0.1:9002:9000" # MinIO S3 API Endpoint
      - "127.0.0.1:9003:9001" # MinIO Web Console UI

  # 3. Mount Local Codebase & Single-Worker Dev Overrides Across Application Surfaces
  mcp-gateway:
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - ./nce:/app/nce
      - ./mcp_gateway_server.py:/app/mcp_gateway_server.py
    environment:
      MCP_GATEWAY_WORKERS: "1"
      NCE_ENV: dev
      LOG_LEVEL: DEBUG

  admin:
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - ./nce:/app/nce
      - ./admin_server.py:/app/admin_server.py
    environment:
      ADMIN_WORKERS: "1"
      NCE_ENV: dev
      LOG_LEVEL: DEBUG

  a2a:
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - ./nce:/app/nce
    environment:
      A2A_WORKERS: "1"
      NCE_ENV: dev
      LOG_LEVEL: DEBUG

  webhook-receiver:
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nce:/app/nce
    environment:
      WEBHOOK_WORKERS: "1"
      NCE_ENV: dev
      LOG_LEVEL: DEBUG

  cron:
    volumes:
      - ./nce:/app/nce
    environment:
      NCE_ENV: dev
      LOG_LEVEL: DEBUG
