[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-cognitive-engine"
version = "3.4.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "mcp>=1.30.0,<2",
    "motor>=3.7.1",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "orjson>=3.10.15",
    "pydantic>=2.13.5",
    "PyJWT>=2.15.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "starlette>=1.7.0",
    "StrEnum>=0.4.15; python_version < '3.11'",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
ml = [
    "openvino",
    "scikit-learn",
    "scipy",
    "sentence-transformers",
    "spacy",
    "torch",
    "transformers",
]
full = [
    "openvino",
    "scikit-learn",
    "scipy",
    "sentence-transformers",
    "spacy",
    "torch",
    "transformers",
]

[project.scripts]
nce-mcp-proxy = "nce.mcp_client_proxy:main"

[tool.setuptools.packages.find]
include = ["nce*"]

[tool.setuptools.package-data]
nce = [
    "*.sql",
    "migrations/*.sql",
    "migrations/optional/*.sql",
    "config_data/*.json",
    "config_data/**/*.json",
    "py.typed",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# First-party = "nce" (the package). Corrected from legacy "trimcp" in the TDL-4/5
# mass-churn sweep at the post-realignment sweet spot (after RL+ML merged to v3.0).
src = ["nce", "tests"]
extend-exclude = [
    "build",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "scratch",
    # ruff 0.16 (2026-09-21 bump from 0.15.20) changed its default file
    # discovery to walk into Markdown and format embedded Python code
    # fences -- new discovery scope, not a rule retuning. `ruff format`
    # reformatting docs/**/*.md's example code blocks is a content change
    # to pages published on GitHub Pages, which is a decision about
    # published material, not a lint-tooling bump -- excluded here so the
    # ruff version bump stays behavior-neutral. Adopting markdown
    # formatting is a separate, visible decision to make on its own, not
    # something to accept as a side effect of a dev-dependency update.
    "*.md",
]

[tool.ruff.lint]
# W605 added 2026-09-19: an invalid escape sequence (e.g. "\|" in a non-raw
# string) is only a DeprecationWarning on the 3.10 every worktree runs, but a
# hard SyntaxError on 3.12 (the deployed runtime, per ci.yml's own matrix
# comment). Cost lane E a full CI round twice: the offending module fails to
# import on 3.12, so every AST-walking ratchet that reads it collapses too
# (19 unrelated-looking failures from one bad docstring). Invisible locally
# by construction -- no worktree here runs 3.12 -- so it can only be caught
# by a lint rule, not by "run the tests before pushing." "E" does not cover
# W-prefixed pycodestyle codes; this is additive to the existing "E" set, not
# a replacement -- confirmed with `ruff check --select W605 .` before adding
# it here, which found zero violations on this tree, run separately from
# (and before) editing this list.
select = ["E", "F", "I", "UP", "G004", "W605", "ASYNC", "DTZ", "S"]
ignore = ["E501", "S101", "S104", "S105", "S106", "S107", "S108", "S110", "S112", "S311", "S603", "S607", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["nce"]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# admin_handlers re-export a shared namespace via `from ._shared import *`
# (F403 is already suppressed at the import line); F405 name-resolution noise follows.
"nce/admin_handlers/*.py" = ["F405"]
# Pre-existing test-scaffold lint debt, scoped per-file (not masked repo-wide).
# Tracked for cleanup alongside the deferred ruff-format sweep.
"tests/conftest.py" = ["E402"]
"tests/test_bridge_dispatch.py" = ["E402"]
"tests/test_mcp_cache.py" = ["F841"]
"tests/test_admin_a2a_api.py" = ["F841"]
"tests/test_batch3_robustness.py" = ["F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = [
    "annotation-unchecked",
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "call-overload",
    "misc",
    "no-redef",
    "return-value",
    "typeddict-item",
    "union-attr",
    "unused-coroutine",
    "var-annotated",
]

