version: 2

updates:
  # Python runtime dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    groups:
      # Security-critical packages get their own group for fast review
      security-critical:
        patterns:
          - "cryptography"
          - "PyJWT"
          - "argon2-cffi"
          - "starlette"
          - "fastapi"
          - "uvicorn"
      # ML stack bumps together (they tend to be interdependent)
      ml-stack:
        patterns:
          - "torch"
          - "transformers"
          - "sentence-transformers"
          - "spacy"
          - "scikit-learn"
          - "numpy"
          - "scipy"
      # Observability stack
      observability:
        patterns:
          - "opentelemetry-*"
          - "prometheus-client"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # aiosmtplib is pinned <4 intentionally — review manually
      - dependency-name: "aiosmtplib"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Node (Tailwind admin build)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps(node)"

  # Go module (go/ -- the nce-launch auth/launcher CLI: MSAL, keyring, JWT handling).
  # Added 2026-09-08, and it should have been in the first pass: enabling alerts immediately
  # surfaced THREE advisories here and none anywhere else --
  #   HIGH   jose2go            <1.7.0   GHSA-9mj6-hxhv-w67j  JWT bomb via decode()
  #   HIGH   golang-jwt/jwt/v5  <5.2.2   GHSA-mh63-6h87-95cp  excessive alloc parsing headers
  #   MEDIUM jose2go            <1.6.0   GHSA-6294-6rgp-fr7r  DoS via large p2c
  # Both are INDIRECT (via microsoft-authentication-library-for-go / keyring), so nothing in
  # go.mod's direct requires hints at them, and `pip-audit` cannot see them at all -- it
  # audits Python distributions only. This module handles tokens and credentials, so "indirect"
  # is not "peripheral": the vulnerable code is on the auth path.
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    labels:
      - "dependencies"
      - "go"
      - "security-critical"
    commit-message:
      prefix: "deps(go)"

  # Container base images.  Added 2026-09-08: without this, NOTHING proposed base-image
  # patches -- python:3.12-slim-bookworm, and the compose service images (postgres, redis,
  # caddy, mongo, minio, jaeger).  OS-level CVEs live in those layers and `pip-audit`
  # cannot see them: it audits Python distributions only.
  - package-ecosystem: "docker"
    directory: "/deploy/multiuser"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "docker"
    directory: "/deploy/cognitive-stub"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"

  # Root: picks up docker-compose.yml's service images where the Dependabot version
  # supports compose manifests under the docker ecosystem.  Unverified at time of
  # writing -- confirm on the first scheduled run before relying on it.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
