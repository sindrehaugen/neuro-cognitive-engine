name: Regenerate generated docs (post-merge)

# §10.5b (ORCH_PROTOCOL.md, 2026-09-19): PRs stop carrying the generated
# artefacts that collided on every merge (K-H7's original problem, then K-H9:
# the merge=ours driver that lowered the per-rebase COST of those collisions
# turned out to be actively dangerous across a second rebase -- it can silently
# replay a stale copy over an already-correct one, with zero conflict markers).
# §10.5b's fix is structural, not another driver: regenerate on `main` AFTER a
# merge, not inside the PR. With no generated files in a PR's diff, there is
# nothing for a rebase to corrupt -- K-H9's whole failure mode needs a
# generated file in the branch to fire on.
#
# THE FILE LIST IS MEASURED, NOT GUESSED FROM WHICH GENERATORS HAVE --check.
# ML-orch ran a file-frequency query against the actual open PR queue
# (#277/#282/#287/#288/#289) after an earlier draft of this job covered only
# the generators that happen to ship a --check flag, which silently missed
# the two biggest conflict sources:
#   5/5 PRs touch docs/_generated/surface.md            (no --check; pytest-gated)
#   5/5 PRs touch docs/_generated/engine_figures.md
#   5/5 PRs touch docs/API.md
#   3/5 PRs touch docs/vertical_engines/ENGINE_STATUS.md
#   3/5 PRs touch docs/_generated/resource_surface.md   (has --check)
#   2/5 PRs touch openapi.json
#   2/5 PRs touch docs/_generated/openapi.json
#   1/5 PRs touch docs/_generated/waves_landed.md       (no --check; advisory-only, Q-17)
#   1/5 PRs touch docs/_generated/host_parity.md         (has --check)
#   0/5 PRs touch docs/_generated/golden_thread_seams.md (no --check; kept anyway --
#       H-9 moved its seam count tonight and a future wave will move it again)
# All 9 files/paths (10 counting openapi.json's two write locations as one
# artefact) are covered below. "Ships a --check flag" and "PRs collide on it"
# are different sets; only the second one is the actual problem.
#
# This job commits straight to `main` (no PR of its own) and only when the
# regenerated content actually differs -- git diff --quiet decides that, the
# same idempotency check used by .github/workflows/refresh-lock.yml.
#
# THIS JOB CANNOT RE-TRIGGER ITSELF (and CI's own --check gates never see its
# commit either): a push made with the default GITHUB_TOKEN does not fire
# `on: push` workflows -- GitHub suppresses that to prevent exactly this kind
# of recursion. refresh-lock.yml:19-21 already documents this for its own
# GITHUB_TOKEN-authored PRs ("a PR opened with GITHUB_TOKEN does not trigger
# other workflows, so the required checks will not start by themselves");
# the same rule applies here to a direct push. There is no infinite-loop risk
# either way (this workflow's own push never re-triggers it), but it also
# means NOTHING external verifies this job's output until the next NON-bot
# push to `main`.
#
# THE FIX: this job verifies its own output before it commits, using
# whichever mechanism actually gates each file today -- not assuming
# "has a --check flag" means "is verified" (surface.md is real, pytest-gated,
# and has no script flag at all):
#   - gen_api_docs.py, gen_openapi.py, gen_engine_figures.py,
#     gen_resource_surface.py, gen_portal_parity.py: their own --check mode.
#   - gen_surface_table.py (surface.md): no --check mode exists, so this job
#     runs the actual gate instead --
#     tests/test_docs_engine_guides_ratchet.py::test_generated_surface_doc_matches_the_generator.
#   - gen_golden_thread_seams.py (golden_thread_seams.md): no --check mode
#     AND no pytest gates it either (confirmed reading tests/ before writing
#     this job) -- genuinely unverifiable today, by any mechanism, not just
#     by this job. Not a gap this change introduces.
#   - gen_waves_landed.py (waves_landed.md): no --check mode, and its own
#     pytest counterpart (test_generated_waves_landed_matches_the_generator)
#     is DELIBERATELY advisory -- Q-17 found the byte-comparison goes red on
#     every unrelated merge because wave stamps move independently of wave
#     landings, and made it non-blocking on purpose. Running that pytest here
#     would not add real protection (it cannot fail), so this job doesn't
#     pretend to gate this file -- it only regenerates it, same as today's
#     advisory-only status.
# WHAT THIS SELF-CHECK ACTUALLY PROVES, STATED PRECISELY (ML-orch correction,
# 2026-09-19): each --check/pytest call above compares the file THIS SAME RUN
# just wrote against a fresh regeneration computed the same way -- fresh
# output compared against fresh output. That passes BY CONSTRUCTION unless the
# generate step and the check step actually disagree (wrong flags, wrong
# paths, a non-deterministic generator, a step that silently failed to
# write). It is real and worth having for exactly that failure class. It does
# NOT prove the docs are semantically correct, and it does NOT prove this
# workflow itself is still running at all -- an outage, a disabled workflow,
# or a revoked permission produces no failed run to see, only silence. That
# gap is closed by .github/workflows/doc-drift-nightly.yml: an independent,
# scheduled, read-only re-check of whatever `main` currently holds, far
# enough after any single merge that this job has certainly already run --
# if IT goes red, this job has stopped working, which the six checks above
# cannot tell you by themselves.
#
# A drift on any of the six gates that CAN fail red fails this job and
# commits nothing -- self-contained, no PAT, no dependency on a workflow
# trigger that cannot fire. This is strictly stronger than what a human
# contributor gets today (a gate that can be forgotten), not a weaker
# substitute for the external ones -- and narrower in scope than "this job's
# output is correct," which is the nightly workflow's job, not this one's.
#
# WHAT HAPPENS IF THIS JOB FAILS: for the six self-checked artefacts (API.md,
# openapi.json, engine_figures.md/ENGINE_STATUS.md, resource_surface.md,
# host_parity.md, surface.md), the job goes red immediately and commits
# nothing -- visible on the Actions tab, and it cannot be silently skipped
# the way a forgotten regeneration in a PR could be before this change. For
# golden_thread_seams.md and waves_landed.md, a bad regeneration is caught
# only by the same manual/nightly discipline (or, for waves_landed.md, the
# same advisory notice) that already applies today -- nothing regresses,
# nothing new is added for those two either.
#
# WHAT HAPPENS IF THIS JOB NEVER RUNS AT ALL: nothing, by itself -- no failed
# run appears anywhere, which is exactly why ci.yml no longer runs any of
# these checks on `push` either (see that file's own history: it used to,
# and every doc-affecting merge left a permanently red run against the merge
# commit, because this job's own fix commit -- GITHUB_TOKEN-authored -- never
# re-triggers `on: push` to re-evaluate the corrected state). The one thing
# that DOES catch this job silently dying is doc-drift-nightly.yml.
#
# KNOWN, ACCEPTED COST: a doc on `main` is briefly stale between a merge
# landing and this job's regen commit landing a few minutes later, and this
# job can lose a race against a fast second merge (its `git push` is
# rejected, non-fast-forward). Both resolve on their own: the job
# regenerates from current HEAD every time and is idempotent, and a lost
# race just means the racing merge's own ordinary (non-bot) push to `main`
# triggers its own run of this workflow, which regenerates against the
# union of both merges' source changes. Nothing is lost, no force-push, no
# rebase.

on:
  push:
    branches: [main, master]

# Only one regen commit in flight at a time; a second push while this job is
# still running should wait its turn rather than race it pointlessly.
concurrency:
  group: regen-generated-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regen:
    name: Regenerate the 9 generated-doc artefacts PRs used to carry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # No torch install here (unlike the `test` job in ci.yml): none of these
      # generators call the codepath that imports sentence_transformers/torch
      # (nce/embeddings.py imports it lazily, inside a function none of these
      # scripts reach) -- checked before writing this job, not assumed from
      # ci.yml's own install list.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Regenerate docs/API.md
        env:
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        run: python scripts/gen_api_docs.py

      - name: Regenerate openapi.json (repo root and docs/_generated/)
        run: python scripts/gen_openapi.py

      - name: Regenerate docs/_generated/engine_figures.md and ENGINE_STATUS.md
        run: |
          python scripts/gen_engine_figures.py --repo . --baseline HEAD \
            --out docs/_generated/engine_figures.md \
            --update-status docs/vertical_engines/ENGINE_STATUS.md

      - name: Regenerate docs/_generated/surface.md
        run: |
          python scripts/gen_surface_table.py --repo . --baseline HEAD \
            --out docs/_generated/surface.md

      - name: Regenerate docs/_generated/resource_surface.md
        env:
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        run: python scripts/gen_resource_surface.py

      - name: Regenerate docs/_generated/golden_thread_seams.md
        run: |
          python scripts/gen_golden_thread_seams.py --repo . --baseline HEAD \
            --out docs/_generated/golden_thread_seams.md

      - name: Regenerate docs/_generated/waves_landed.md
        # Deliberately no --live-prs: that flag shells out to `gh` for live
        # merged-PR data, which would add a network/auth dependency to this
        # job for a file whose own drift check is advisory-only (see header).
        # A human doing a one-off richer audit can still pass it by hand.
        run: |
          python scripts/gen_waves_landed.py --repo . --baseline HEAD \
            --out docs/_generated/waves_landed.md

      # Not one of ML-orch's originally-named files, but the same class of
      # hazard under the same docs/_generated/** merge=ours glob (now
      # removed) -- included so this wave actually drains every generated
      # artefact a PR could still collide on, not just the ones measured.
      - name: Regenerate docs/_generated/host_parity.md
        run: python scripts/gen_portal_parity.py

      # This job's own commit is invisible to ci.yml's --check gates (see the
      # header comment: GITHUB_TOKEN pushes don't trigger `on: push`), so this
      # step is the only thing that verifies every self-checkable artefact
      # before anything is committed -- using each file's REAL gate, not just
      # the ones with a --check flag (surface.md has none; its gate is the
      # pytest below). A drift here means a bug in this job's own invocations
      # (wrong flags, wrong paths, an environment difference) -- fail loudly,
      # commit nothing. golden_thread_seams.md and waves_landed.md are
      # deliberately absent from this step -- see the header for why each is
      # genuinely unverifiable or advisory-only today, not an oversight.
      - name: Verify regenerated docs against their real gate (script --check or the actual pytest)
        env:
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        run: |
          python scripts/gen_api_docs.py --check
          python scripts/gen_openapi.py --check
          python scripts/gen_engine_figures.py --repo . --baseline HEAD \
            --out docs/_generated/engine_figures.md \
            --update-status docs/vertical_engines/ENGINE_STATUS.md --check
          python scripts/gen_resource_surface.py --check
          python scripts/gen_portal_parity.py --check
          pytest tests/test_docs_engine_guides_ratchet.py::test_generated_surface_doc_matches_the_generator -q

      - name: Commit and push if the regenerated docs actually changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGETS="docs/API.md openapi.json docs/_generated/openapi.json \
            docs/_generated/engine_figures.md docs/vertical_engines/ENGINE_STATUS.md \
            docs/_generated/surface.md docs/_generated/resource_surface.md \
            docs/_generated/golden_thread_seams.md docs/_generated/waves_landed.md \
            docs/_generated/host_parity.md"

          if git diff --quiet -- $TARGETS; then
            echo "No drift -- generated docs already match ${{ github.ref_name }}."
            exit 0
          fi

          git add $TARGETS
          git commit -m "docs: regenerate generated artefacts [bot]

          Auto-regenerated by .github/workflows/regen-generated-docs.yml
          after a merge to ${{ github.ref_name }} changed something these
          docs are derived from, and self-verified in this same run (see the
          'Verify regenerated docs against their real gate' step) since this
          commit's own push does not trigger ci.yml's external gates. See
          that workflow for the exact generator invocations and the measured
          file list; see charter §10.5b for why this runs post-merge instead
          of inside the PR that changed the source."

          if ! git push origin HEAD:${{ github.ref_name }}; then
            echo "Push rejected -- ${{ github.ref_name }} moved under this job (a fast second merge, the known/accepted race in this workflow's header comment). That merge's own ordinary push triggers its own run of this workflow, which regenerates against the current state; nothing from this run is lost, nothing needs a retry here."
            exit 0
          fi
