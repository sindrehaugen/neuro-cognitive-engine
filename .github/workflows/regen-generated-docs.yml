name: Regenerate generated docs (post-merge)

# §10.5b (ORCH_PROTOCOL.md, 2026-09-19): PRs stop carrying the generated
# artefacts that collided on every merge (K-H7's original problem, then K-H9:
# the merge=ours driver that lowered the per-rebase COST of those collisions
# turned out to be actively dangerous across a second rebase -- it can silently
# replay a stale copy over an already-correct one, with zero conflict markers).
# §10.5b's fix is structural, not another driver: regenerate on `main` AFTER a
# merge, not inside the PR. With no generated files in a PR's diff, there is
# nothing for a rebase to corrupt -- K-H9's whole failure mode needs a
# generated file in the branch to fire on.
#
# This job commits straight to `main` (no PR of its own) and only when the
# regenerated content actually differs -- git diff --quiet decides that, the
# same idempotency check used by .github/workflows/refresh-lock.yml.
#
# THIS JOB CANNOT RE-TRIGGER ITSELF (and CI's own --check gates never see its
# commit either): a push made with the default GITHUB_TOKEN does not fire
# `on: push` workflows -- GitHub suppresses that to prevent exactly this kind
# of recursion. refresh-lock.yml:19-21 already documents this for its own
# GITHUB_TOKEN-authored PRs ("a PR opened with GITHUB_TOKEN does not trigger
# other workflows, so the required checks will not start by themselves");
# the same rule applies here to a direct push. An earlier draft of this
# workflow claimed the opposite -- that ci.yml's --check gates would run on
# this job's own regen commit -- which is false, caught by ML-orch before
# merge. There is no infinite-loop risk either way (this workflow's own
# push never re-triggers it), but it also means NOTHING external verifies
# this job's output until the next NON-bot push to `main`.
#
# THE FIX: this job verifies its own output before it commits, using each
# generator's own --check mode (gen_engine_figures.py, gen_openapi.py,
# gen_api_docs.py, gen_portal_parity.py all have one; see the "Verify"
# step below). If any disagree, the job fails RED on the Actions tab and
# commits nothing -- self-contained, no dependency on a workflow trigger
# that cannot fire, no PAT needed. This is strictly stronger than what a
# human contributor gets today (a gate that cannot be skipped), not a
# weaker substitute for the external gates.
#
# RESIDUAL, STATED NOT FIXED: gen_golden_thread_seams.py has no --check mode
# at all (confirmed reading the script), so this job cannot self-verify
# docs/_generated/golden_thread_seams.md the way it can the other four --
# and this is not a gap this change introduces: no CI gate anywhere checks
# that file today either (checked before writing this job). Out of scope
# for §10.5b to fix; noted so it is not mistaken for solved.
#
# WHAT HAPPENS IF THIS JOB FAILS: for the four self-checked artefacts, the
# job goes red immediately and commits nothing -- visible on the Actions tab
# like any other failing job, and it cannot be silently skipped the way a
# forgotten regeneration in a PR could be before this change. For
# golden_thread_seams.md specifically (the one file with no --check), a bad
# regeneration is only caught by the same manual/nightly discipline that
# already applies today (nothing regresses; nothing new is added either).
#
# KNOWN, ACCEPTED COST: a doc on `main` is briefly stale between a merge
# landing and this job's regen commit landing a few minutes later, and this
# job can lose a race against a fast second merge (its `git push` is
# rejected, non-fast-forward). Both resolve on their own: the job
# regenerates from current HEAD every time and is idempotent, and a lost
# race just means the racing merge's own ordinary (non-bot) push to `main`
# triggers its own run of this workflow, which regenerates against the
# union of both merges' source changes. Nothing is lost, no force-push, no
# rebase.

on:
  push:
    branches: [main, master]

# Only one regen commit in flight at a time; a second push while this job is
# still running should wait its turn rather than race it pointlessly.
concurrency:
  group: regen-generated-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regen:
    name: Regenerate docs/API.md, openapi.json, engine figures, golden thread seams, host parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # No torch install here (unlike the `test` job in ci.yml): none of these
      # generators call the codepath that imports sentence_transformers/torch
      # (nce/embeddings.py imports it lazily, inside a function none of these
      # scripts reach) -- checked before writing this job, not assumed from
      # ci.yml's own install list.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Regenerate docs/API.md
        env:
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        run: python scripts/gen_api_docs.py

      - name: Regenerate openapi.json (repo root and docs/_generated/)
        run: python scripts/gen_openapi.py

      - name: Regenerate docs/_generated/engine_figures.md and ENGINE_STATUS.md
        run: |
          python scripts/gen_engine_figures.py --repo . --baseline HEAD \
            --out docs/_generated/engine_figures.md \
            --update-status docs/vertical_engines/ENGINE_STATUS.md

      - name: Regenerate docs/_generated/golden_thread_seams.md
        run: |
          python scripts/gen_golden_thread_seams.py --repo . --baseline HEAD \
            --out docs/_generated/golden_thread_seams.md

      # Not one of ML-orch's named 5, but the same class of hazard under the
      # same docs/_generated/** merge=ours glob (now removed) -- included so
      # this wave actually drains every generated artefact a PR could still
      # collide on, not just the five that happened to be measured.
      - name: Regenerate docs/_generated/host_parity.md
        run: python scripts/gen_portal_parity.py

      # This job's own commit is invisible to ci.yml's --check gates (see the
      # header comment: GITHUB_TOKEN pushes don't trigger `on: push`), so this
      # step is the only thing that verifies the four self-checkable
      # generators before anything is committed. A drift here means a bug in
      # this job's own invocations (wrong flags, wrong paths, an environment
      # difference from what --check expects) -- fail loudly, commit nothing.
      - name: Verify regenerated docs pass their own --check (self-contained, no external trigger needed)
        env:
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        run: |
          python scripts/gen_api_docs.py --check
          python scripts/gen_openapi.py --check
          python scripts/gen_engine_figures.py --repo . --baseline HEAD \
            --out docs/_generated/engine_figures.md \
            --update-status docs/vertical_engines/ENGINE_STATUS.md --check
          python scripts/gen_portal_parity.py --check

      - name: Commit and push if the regenerated docs actually changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGETS="docs/API.md openapi.json docs/_generated/openapi.json \
            docs/_generated/engine_figures.md docs/vertical_engines/ENGINE_STATUS.md \
            docs/_generated/golden_thread_seams.md docs/_generated/host_parity.md"

          if git diff --quiet -- $TARGETS; then
            echo "No drift -- generated docs already match ${{ github.ref_name }}."
            exit 0
          fi

          git add $TARGETS
          git commit -m "docs: regenerate generated artefacts [bot]

          Auto-regenerated by .github/workflows/regen-generated-docs.yml
          after a merge to ${{ github.ref_name }} changed something these
          docs are derived from, and self-verified in this same run (see the
          'Verify regenerated docs pass their own --check' step) since this
          commit's own push does not trigger ci.yml's external gates. See
          that workflow for the exact generator invocations; see charter
          §10.5b for why this runs post-merge instead of inside the PR that
          changed the source."

          if ! git push origin HEAD:${{ github.ref_name }}; then
            echo "Push rejected -- ${{ github.ref_name }} moved under this job (a fast second merge, the known/accepted race in this workflow's header comment). That merge's own ordinary push triggers its own run of this workflow, which regenerates against the current state; nothing from this run is lost, nothing needs a retry here."
            exit 0
          fi
