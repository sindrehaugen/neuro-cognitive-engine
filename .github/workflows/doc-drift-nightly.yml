name: Nightly doc-drift check (independent scheduled re-check)

# 🔴 regen-generated-docs.yml, the "post-merge regen job" this workflow's
# comments below refer to, is DELETED (2026-09-20): `main` requires 9 status
# checks even for a direct push (`enforce_admins: true`), so that job's
# GITHUB_TOKEN commits were unconditionally rejected -- structurally, not
# intermittently. A fix that made its own diff check ignore the volatile
# stamp churn documented further down would only have turned "always red"
# into "always a silent no-op": the job could still never push a REAL fix if
# one were ever needed, so patching its detection would not have restored any
# value it could actually deliver. Deleted rather than patched.
#
# THIS WORKFLOW IS KEPT, UNCHANGED IN PURPOSE: it was never just "does the
# regen job still work" -- it is an independent, scheduled, read-only
# re-check of whatever `main` currently holds, and it is what actually caught
# the post-merge job's silent-failure incident in the first place. With
# ci.yml's PR/push doc gates restored (§10.5b reverted the same night), this
# nightly check is now redundant CONFIRMATION of those gates, not a
# substitute for them -- both check the same 4 files against the same
# source, so agreement is the expected, unremarkable case.
#
# KNOWN GAPS AT THE TIME OF THIS INCIDENT (2026-09-19) -- TWO SINCE CLOSED,
# stated here for history, not because they are still open:
#   - docs/vertical_engines/ENGINE_STATUS.md had no byte-for-byte check
#     anywhere (ci.yml's D-GEN step never passed --update-status to check
#     it; tests/unit/test_config_docs_ratchet.py cross-validates its NUMBERS
#     independently of the generator, which is a different, narrower
#     guarantee than "matches a fresh regen"). CLOSED 2026-09-20 (PR #306):
#     tests/test_engine_status_current.py calls update_engine_status() and
#     normalize_volatile() directly against the committed file, is
#     doc_gate-marked, and runs in the "pytest -m doc_gate" step below.
#   - docs/_generated/golden_thread_seams.md had no --check mode and no
#     pytest gated it, by any mechanism. CLOSED 2026-09-20 (PR #306):
#     tests/test_golden_thread_seams_current.py regenerates against
#     --baseline HEAD and compares, is doc_gate-marked, and runs in the same
#     step. The generator itself still ships no --check mode of its own --
#     the gate regenerates-and-compares in the test instead, per that test's
#     own docstring.
#   - docs/_generated/waves_landed.md has a pytest counterpart but it is
#     DELIBERATELY advisory (Q-17: the byte-comparison goes red on every
#     unrelated merge because wave stamps move independently of wave
#     landings). Still true, still deliberate -- not a gap to close.
# The regen-job deletion and the workflow-removal-from-ci.yml decisions
# above are unaffected by this update; only the two ENGINE_STATUS.md /
# golden_thread_seams.md claims had gone stale.
#
# §10.5b, second correction (ORCH_PROTOCOL.md, 2026-09-19): the four doc-drift
# checks (docs/API.md, openapi.json, docs/_generated/surface.md,
# docs/_generated/host_parity.md) plus the D-GEN engine-figures --check gate
# used to run on every push to `main`. That looked like ongoing enforcement but
# was not: an ordinary merge always leaves `main` transiently stale for exactly
# one commit (PRs no longer carry these files, by design), so that check ran,
# found the EXPECTED staleness, and went red -- then the post-merge regen job's
# own fix commit never re-triggers ci.yml (GITHUB_TOKEN pushes don't fire
# `on: push`, per K-H9/K-H11), so nothing ever re-evaluates the corrected
# state. Every doc-affecting merge left a PERMANENTLY red ci.yml run against
# the merge commit -- not a window, a scar -- for information that was never
# actionable (the staleness was expected and self-corrected within minutes).
#
# Removed those checks from ci.yml entirely (both events) rather than leaving
# them on push. Reasoning: after #295, the committed docs on `main` are
# current by construction -- the job regenerates after every merge. Those
# checks existed to catch a human who forgot to regenerate; there is no human
# in that path any more, so running them on every push reports zero new
# information, permanently, for the one guaranteed case they can ever fire.
#
# WHAT THIS WORKFLOW COVERS THAT THE REMOVED CHECKS DID NOT:
# regen-generated-docs.yml's own in-job "verify" step regenerates a file, then
# runs --check against what it JUST wrote -- fresh output compared to fresh
# output, which passes by construction unless the generate step and the check
# step disagree (different flags, different paths, a non-deterministic
# generator, a step that silently failed to write). It does NOT prove the
# regen job actually ran, has current permissions, or is even enabled.
#
# This workflow is that check: an independent, scheduled, READ-ONLY run
# (never writes, never commits) against whatever `main` currently holds, far
# enough after any single merge that the post-merge job has certainly already
# run. If this goes red, it means the regen job stopped working -- disabled,
# broken permissions, GitHub Actions outage, a generator regression it failed
# to catch itself -- not "someone forgot to regenerate," which cannot happen
# any more. A scheduled workflow failing is a distinct, actionable signal from
# a per-merge status flicker, and it does not accumulate a scar per merge.

on:
  schedule:
    - cron: "30 4 * * *" # daily, offset from nightly-golden-thread.yml's 02:00 UTC
  workflow_dispatch:

jobs:
  check:
    name: Confirm docs/API.md, openapi.json, engine figures, surface.md, host_parity.md are current on main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The banner-drift report below diffs each doc's claimed SHA against
      # HEAD, and claimed SHAs can be days or weeks old -- actions/checkout's
      # default shallow clone (depth 1) would make every one of them look
      # unresolvable, which is indistinguishable from the genuine MISSING_SHA
      # case this report exists to name correctly. Unshallow once, here, for
      # every step below rather than doing it inside the script itself.
      - name: Fetch full history (needed for banner-SHA resolution)
        run: git fetch --prune --unshallow || git fetch --prune

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # No torch: none of these checks import the lazy sentence_transformers
      # codepath (same reasoning as regen-generated-docs.yml).
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Engine figures are current (D-GEN gate)
        run: |
          python scripts/gen_engine_figures.py --repo . --baseline HEAD \
            --out docs/_generated/engine_figures.md --check

      - name: docs/API.md, openapi.json, surface.md, host_parity.md are current
        env:
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        run: pytest -m doc_gate -q --tb=short

      # Advisory only -- see scripts/check_docs_banner_drift.py's own
      # docstring. Deliberately NOT a gate: 130+ docs carry a
      # `Verified-against` banner and main moves daily, so treating this as
      # pass/fail would make the job permanently red for information that
      # is almost always already true (the same Q-17 reasoning already
      # governing waves_landed.md's own advisory pytest, above). This step
      # always exits 0; read its output (or the job summary) for what
      # actually drifted, ranked by files, not just a count.
      - name: Doc banner drift report (advisory only, never fails the job)
        if: always()
        run: python scripts/check_docs_banner_drift.py --against HEAD
