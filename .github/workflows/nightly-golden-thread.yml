name: Nightly Golden Thread (Live Stack)
'on':
  schedule:
  - cron: 0 2 * * *
  workflow_dispatch: null
jobs:
  golden-thread:
    name: Golden Thread E2E Scenario
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mcp_user
          POSTGRES_PASSWORD: mcp_password
          POSTGRES_DB: memory_meta
        ports:
        - 15432:5432
        options: --health-cmd "pg_isready -U mcp_user -d memory_meta" --health-interval 5s --health-timeout 5s --health-retries
          12
      redis:
        image: redis:7.4-alpine
        ports:
        - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: 'requirements.txt

          requirements-dev.txt

          '
    - name: Install dependencies
      run: 'pip install --index-url https://download.pytorch.org/whl/cpu torch

        pip install -r requirements.txt -r requirements-dev.txt

        '
    - name: Apply Postgres schema
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
      run: python scripts/apply_integration_schema.py
