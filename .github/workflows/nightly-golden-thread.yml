name: Nightly Golden Thread (Live Stack)

"on":
  schedule:
    - cron: "0 2 * * *"  # Run nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  golden-thread:
    name: Golden Thread E2E Scenario
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mcp_user
          POSTGRES_PASSWORD: mcp_password
          POSTGRES_DB: memory_meta
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U mcp_user -d memory_meta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply Postgres schema
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        run: python scripts/apply_integration_schema.py

      - name: Golden Thread E2E Live Run
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_TEST_REDIS_URL: redis://localhost:6380/14
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/integration/test_golden_thread.py -m live -v --tb=short
