      # C12 resource-surface handle_upsert: a real Postgres timestamptz column
      # requires a real datetime, not the isoformat() string every mocked test
      # for a C12 resource happily accepts. Found live building H-9's Golden
      # Thread v2 extension (2026-09-19) -- affected 26 of 30 registered
      # ResourceSpecs. See the test file's own docstring for the second,
      # subtler defect (a version-comparison format mismatch) a type-only fix
      # would have left in place.
      - name: Integration — C12 resource-surface upsert (tests/integration/test_resource_surface_upsert_live.py)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/integration/test_resource_surface_upsert_live.py -m integration -q --tb=short

      # Q-48 follow-on: handle_bulk's table-backed path opened a NEW
      # scoped_pg_session (transaction) per item, so a mid-batch failure left
      # whatever had already committed in place instead of rolling back the
      # whole batch -- an accidental partial commit, never a chosen semantics.
      # Fixed to one shared transaction for the whole batch; this test proves
      # a real UNIQUE violation on item 3 of 3 leaves zero rows behind.
      - name: Integration — C12 resource-surface bulk all-or-nothing (tests/integration/test_resource_surface_bulk_transaction_live.py)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/integration/test_resource_surface_bulk_transaction_live.py -m integration -q --tb=short

      # C12 resource-surface per-namespace opt-in gate: nce/resource_surface/
      # (mcp.py, rest.py) called none of the 7 gated engines' own
      # require_*_enabled, for any of their 18 registered ResourceSpecs -- a
      # feature-boundary bypass within a namespace (RLS still scopes by
      # namespace_id; a namespace that never opted in to e.g. inventory could
      # still read/write it through the generated surface while the
      # hand-written routes correctly refuse). Found by lane E, quantified by
      # ML-orch, fixed by lane H (2026-09-19) via ResourceSpec.enabled_guard.
      - name: Integration — C12 resource-surface engine-guard (tests/integration/test_resource_surface_engine_guard_live.py)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/integration/test_resource_surface_engine_guard_live.py -m integration -q --tb=short

      # C12 resource-surface multi-table support (SecondaryTable): a spec whose
      # primary identity spreads across two tables (e.g. system_design's DEVICE
      # capability/state split). Found live building this: an undocumented FK
      # (fk_sddc_kg_nodes) requiring the kg_nodes row to exist first, and
      # INSERT...ON CONFLICT DO UPDATE validating the INSERT branch's NOT NULL
      # columns even when it resolves to UPDATE -- would have shipped as a
      # working PATCH that silently fails on partial updates of an existing
      # secondary-table row. Fixed via shared upsert_secondary_tables()
      # (nce/resource_surface/rest.py), used by both mcp.py and rest.py.
      - name: Integration — C12 resource-surface multi-table (tests/integration/test_resource_surface_multi_table_live.py)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/integration/test_resource_surface_multi_table_live.py -m integration -q --tb=short

      # C12 resource-surface kg_nodes-primary support (Wave 3(b)): the
      # generated read/write path for tenant_scope="graph" specs
      # (table_name=None), targeting DEVICE/PORT/RACK/CABLE. kg_nodes has no
      # attribute column of its own (verified against every existing
      # consumer -- case_study.py, tasks.py, fl_tree.py -- before writing
      # any code); every real field routes to a secondary table via Wave 1's
      # upsert_secondary_tables(), joined on the kg_nodes identity row this
      # wave creates first (every system_design satellite table carries a
      # real FK to kg_nodes(label, namespace_id)). Also fixed live:
      # requires_namespace never considered graph-scoped specs (no
      # graph-primary spec ever had a real query path before this wave), so
      # omitting namespace_id silently bound `WHERE namespace_id = NULL` and
      # returned an empty list instead of a 422 -- same failure class as the
      # H-4 global-scope gap, on the graph branch instead. Also deleted 9
      # dead 501 guards on rest.py sub-resource handlers (events/comments/
      # tags/documents) that never depended on spec.table_name in the first
      # place -- proven live, not just "stopped erroring", via the comments
      # test in this suite.
      - name: Integration — C12 resource-surface kg_nodes-primary (tests/integration/test_resource_surface_kg_nodes_primary_live.py)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/integration/test_resource_surface_kg_nodes_primary_live.py -m integration -q --tb=short

      # Wave C-6: PROJECT_PROJECT C12 resource declaration (thin kg_nodes-
      # primary identity only -- kg_nodes has no attribute storage for any
      # PROJECT_* node type, Q-47, still open) plus
      # GET /api/project/{id}/bom-lines, exposing list_bom_lines_for_quote
      # (nce/bom_lines.py), which existed with no route before this wave.
      - name: Integration — Project C12 resource + bom-lines route (tests/integration/test_project_resource_surface_live.py)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/integration/test_project_resource_surface_live.py -m integration -q --tb=short

      # Wave B-2: CONTACT C12 resource declaration (kg_nodes-primary identity
      # + sales_contacts satellite table, migration 097). Bulk create stays
      # refused (identity-plus-satellite partial-failure has no precedent);
      # create performs no entity resolution (resolve() is read-only and
      # never auto-merges) -- both proven live here, not just documented.
      - name: Integration — Sales CONTACT C12 resource (tests/integration/test_sales_contact_resource_surface_live.py)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/integration/test_sales_contact_resource_surface_live.py -m integration -q --tb=short

      # Migration 106 (Q-49): product_catalog.lifecycle_status becomes a closed,
      # checked vocabulary ('coming'|'active'|'EOL'|'EOS'). Live positive control
      # for the CHECK constraint itself: a fifth value is rejected at the storage
      # level, each of the four valid values is accepted, and the column's own
      # DEFAULT ('active') still satisfies the constraint.
      - name: Integration — Product lifecycle_status CHECK constraint (tests/integration/test_product_lifecycle_status_check.py)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/integration/test_product_lifecycle_status_check.py -m integration -q --tb=short


  # REST-surface mutations must invalidate the MCP response cache.
  # `bump_cache_generation` is called from the MCP dispatch loop only, so a
  # mutation performed through nce/admin_handlers/* left cacheable MCP reads
  # serving pre-mutation data for the full MCP_CACHE_TTL_S (300 s). Found in the
  # Batch 143 audit; pre-existing and systemic, not introduced by that wave.
  #
  # This runs as its OWN job rather than a step in `integration`, for two
  # reasons. It needs a real Redis — tests/test_mcp_cache.py mocks
  # redis_client, which stores nothing and therefore cannot detect staleness at
  # all — and a `services:` block is job-wide, so adding Redis to `integration`
  # would put a live Redis under every other step there, silently flipping any
  # test that currently takes a Redis-absent fallback path. It also needs no
  # Postgres: the test stubs the do_* cores and exercises the cache mechanism
  # itself, so a dedicated job is both safer and cheaper.
  cache-invalidation:
    name: Pytest (REST/MCP cache invalidation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          # CI has no GPU. torch is pinned >=2.13.0 and floated to 2.14.0, whose
          # default wheels pull nvidia_cudnn_cu13 (553 MB), nvidia_nccl_cu13
          # (216 MB) and triton (248 MB) on top of torch itself (555 MB) -- about
          # 3.2 GB of downloads, which exhausts the runner disk (ENOSPC). The CPU
          # index drops the CUDA wheels entirely; nothing here runs on a GPU.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt

      # Reads through the cacheable MCP path, mutates through the REST route,
      # reads again. FAILS on the unfixed tree — that is the point.
      - name: Integration — REST/MCP cache invalidation (real Redis)
        env:
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_TEST_REDIS_URL: redis://localhost:16379/15
        run: pytest tests/test_rest_cache_invalidation.py -m integration -q --tb=short

  go:
    name: Go (build & test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum

      - name: Go format check
        working-directory: ./go
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        working-directory: ./go
        run: go vet ./...

      - name: Go build
        working-directory: ./go
        run: go build ./...

      - name: Go test
        working-directory: ./go
        run: go test ./... -v

      - name: Build Linux binaries (amd64 + arm64)
        run: bash build/linux/build.sh

