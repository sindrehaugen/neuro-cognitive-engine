name: CI
on:
  pull_request:
  push:
    branches:
    - main
    - master
jobs:
  lint:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: Install Ruff
      run: pip install -r requirements-dev.txt
    - name: Ruff check
      run: ruff check .
    - name: Ruff format (check only)
      run: ruff format --check .
    - name: Docs links & code fences
      run: python scripts/verify_docs_links_and_syntax.py
    - name: Engine figures are current (D-GEN gate)
      run: 'python scripts/gen_engine_figures.py --repo . --baseline HEAD             --out docs/_generated/engine_figures.md
        --check

        '
    - name: Schema halves match schema.sql (Q-4 gate)
      run: python scripts/split_schema.py --check
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Verify requirements.lock is current
      run: 'pip install pip-tools==7.6.1

        python scripts/compile_requirements.py

        git diff --exit-code requirements.lock

        '
    - name: Python platform coupling (runtime image = lock = matrix)
      run: python scripts/check_python_platform_coupling.py
    - name: Every locked pin installs on the runtime's Python
      run: pip install --dry-run --no-deps -r requirements.lock
  test:
    name: Pytest (unit, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: 'requirements.txt

          requirements-dev.txt

          '
    - name: Install dependencies
      run: '# CI has no GPU. torch is pinned >=2.13.0 and floated to 2.14.0, whose

        # default wheels pull nvidia_cudnn_cu13 (553 MB), nvidia_nccl_cu13

        # (216 MB) and triton (248 MB) on top of torch itself (555 MB) -- about

        # 3.2 GB of downloads, which exhausts the runner disk (ENOSPC). The CPU

        # index drops the CUDA wheels entirely; nothing here runs on a GPU.

        pip install --index-url https://download.pytorch.org/whl/cpu torch

        pip install -r requirements.txt -r requirements-dev.txt

        '
    - name: Pytest (exclude integration)
      env:
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        DROPBOX_APP_SECRET: test-dropbox-secret
        GRAPH_CLIENT_STATE: test-graph-state
        DRIVE_CHANNEL_TOKEN: test-drive-token
        MINIO_ACCESS_KEY: test-minio-access-key
        MINIO_SECRET_KEY: test-minio-secret-key
      run: pytest tests/ -m "not integration and not perf and not live" -q --tb=short
    - name: Empty with-block gate
      run: python scripts/check_empty_with.py
  security:
    name: Security & IaC validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install security tools
      run: pip install bandit==1.8.3 pip-audit==2.9.0
    - name: Bandit (high severity)
      run: bandit -r nce server.py admin_server.py --severity-level high -q
    - name: pip-audit (requirements)
      run: pip-audit -r requirements.txt --strict
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: latest
    - name: Terraform validate (GCP)
      working-directory: trimcp-infra/gcp
      run: 'terraform init -backend=false

        terraform validate

        '
    - name: Terraform validate (AWS)
      working-directory: trimcp-infra/aws
      run: 'terraform init -backend=false

        terraform validate

        '
    - name: Docker Compose config validate
      env:
        REDIS_PASSWORD: ci-config-validate-dummy
      run: 'cp deploy/compose.stack.env.example deploy/compose.stack.env

        touch deploy/compose.stack.env.generated

        docker compose -f docker-compose.yml config --quiet

        '
  integration:
    name: Pytest (integration smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mcp_user
          POSTGRES_PASSWORD: mcp_password
          POSTGRES_DB: memory_meta
        ports:
        - 15432:5432
        options: --health-cmd "pg_isready -U mcp_user -d memory_meta" --health-interval 5s --health-timeout 5s --health-retries
          12
      redis:
        image: redis:7.4-alpine
        ports:
        - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: 'requirements.txt

          requirements-dev.txt

          '
    - name: Install dependencies
      run: '# CI has no GPU. torch is pinned >=2.13.0 and floated to 2.14.0, whose

        # default wheels pull nvidia_cudnn_cu13 (553 MB), nvidia_nccl_cu13

        # (216 MB) and triton (248 MB) on top of torch itself (555 MB) -- about

        # 3.2 GB of downloads, which exhausts the runner disk (ENOSPC). The CPU

        # index drops the CUDA wheels entirely; nothing here runs on a GPU.

        pip install --index-url https://download.pytorch.org/whl/cpu torch

        pip install -r requirements.txt -r requirements-dev.txt

        '
    - name: Apply Postgres schema
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
      run: python scripts/apply_integration_schema.py
    - name: "Schema drift \u2014 the DB has everything schema.sql guarantees (Q-4)"
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
      run: python scripts/check_schema_drift.py --dsn "$PG_DSN"
    - name: Integration smoke (RLS, schema, event log, outbox)
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: '1'
      run: pytest tests/test_rls_isolation_integration.py tests/test_schema_bootstrap.py tests/test_rls_catalog.py tests/test_outbox_fanout.py
        tests/test_event_log_hardening.py tests/test_node_ownership_seed_bulk.py tests/test_namespace_fk_cascade.py tests/test_namespace_fixture_teardown.py
        tests/test_worm_registry.py
        -m integration -q --tb=short
    - name: "Integration \u2014 WORM TRUNCATE guard (RL-H18)"
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: '1'
      run: pytest tests/test_worm_truncate_guard.py -m integration -q --tb=short
    - name: "Integration \u2014 trust ledger, event-log concurrency & chain verify (Q-12)"
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: '1'
      run: pytest tests/test_actor_trust.py tests/test_event_log_concurrency.py tests/test_event_log_verification.py -m integration
        -q --tb=short
    - name: "Integration \u2014 health probes (RL-H21)"
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: '1'
      run: pytest tests/test_health_probes.py -m integration -q --tb=short
    - name: "Integration \u2014 product, sales & project (Q-12)"
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: '1'
      run: pytest tests/test_price_resolution.py tests/test_pricing_surface.py -m integration -q --tb=short
    - name: "Integration \u2014 graph, entity resolution & consolidation (Q-12)"
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: '1'
      run: pytest tests/test_cascade_residual.py tests/test_causal_dag.py tests/test_consolidation_depth.py tests/test_entity_merge_queue.py
        tests/test_entity_resolution_surface.py tests/test_entity_resolver.py tests/test_explain_memory.py tests/test_grounded_helper.py
        tests/test_merge_queue_api.py tests/test_node_ownership_registry.py tests/test_ownership_guard.py tests/test_survivorship.py
        -m integration -q --tb=short
    - name: "Integration \u2014 platform, migrations & the rest (Q-12)"
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: '1'
      run: pytest tests/test_autonomy_schema.py tests/test_c1_donewhen.py tests/test_c2_donewhen.py tests/test_c5_donewhen.py
        tests/test_event_bus_interface.py tests/test_migration_003_quota_check.py tests/test_migration_004_event_sequences_backfill.py
        tests/test_outbox_idempotency.py tests/test_pg_trgm_extension.py tests/test_principal_sessions.py tests/test_generic_source_mode_endpoint.py
        tests/test_schema_contract.py tests/test_source_mode_flip.py tests/test_source_mode_heartbeat.py tests/test_source_mode_resolver.py
        tests/test_source_mode_table.py -m integration -q --tb=short
    - name: "Integration \u2014 security controls (ML-CI1)"
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: '1'
      run: pytest tests/test_c3_adversarial.py tests/test_external_scope_rls.py tests/unit/test_c3_external_scope_review_ratchet.py
        tests/test_worm_db_enforcement.py tests/test_batch44_worm_pii_sidesinks.py tests/test_active_learning_signals.py tests/unit/test_signing_credentials_q4_ratchet.py
        -m integration -q --tb=short
    - name: "Integration \u2014 cron saga-recovery jsonb payload decode (tests/integration/test_cron_saga_recovery_live.py)"
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: '1'
        REDIS_URL: redis://localhost:6380/13
      run: pytest tests/integration/test_cron_saga_recovery_live.py -m integration -q --tb=short
    - name: Integration ? event log suite (tests/test_event_log_*.py)
      env:
        PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: '1'
      run: pytest tests/test_event_log_*.py -m integration -q --tb=short
  cache-invalidation:
    name: Pytest (REST/MCP cache invalidation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
        - 16379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    - name: Install dependencies
      run: |
        pip install --index-url https://download.pytorch.org/whl/cpu torch
        pip install -r requirements.txt -r requirements-dev.txt
    - name: "Integration \u2014 REST/MCP cache invalidation (real Redis)"
      env:
        NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
        NCE_TEST_REDIS_URL: redis://localhost:16379/15
      run: pytest tests/test_rest_cache_invalidation.py -m integration -q --tb=short
  go:
    name: Go (build & test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.22'
        cache-dependency-path: go/go.sum
    - name: Go format check
      working-directory: ./go
      run: test -z "$(gofmt -l .)"
    - name: Go vet
      working-directory: ./go
      run: go vet ./...
    - name: Go build
      working-directory: ./go
      run: go build ./...
    - name: Go test
      working-directory: ./go
      run: go test ./... -v
    - name: Build Linux binaries (amd64 + arm64)
      run: bash build/linux/build.sh
