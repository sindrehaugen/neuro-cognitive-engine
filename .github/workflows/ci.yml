name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ruff
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      # TDL-4/5 (2026-06-22): the ruff format sweep + isort first-party rename (trimcp -> nce)
      # landed on main at the post-realignment sweet spot (v3.0). Now BLOCKING.
      - name: Ruff format (check only)
        run: ruff format --check .

      # TD-1: this checker existed but was wired into no workflow, so neither its
      # passes nor its failures were ever observed. Link and code-fence failures are
      # blocking; the Verified-against stamp is reported as a warning only. It needs
      # no database and no services, so it belongs in the lint job.
      - name: Docs links & code fences
        run: python scripts/verify_docs_links_and_syntax.py

      # 🔴 The generated engine figures were STALE on `main` at 3c019bd, while the page's own
      # header read "This page is generated by scripts/gen_engine_figures.py - it cannot go
      # stale." It said 271 tools / migrations 001->078; the tree held 273 and 001->080, and
      # ENGINE_STATUS.md mirrored both wrong numbers.
      #
      # The generator already shipped a --check mode (D-GEN). Nothing ran it: a grep for
      # "engine_figures" across tests/, .github/ and scripts/ matched the generator itself and
      # nothing else. A gate that exists and is wired into no workflow is the same defect class
      # as TD-1 above, and as the healthchecks that returned 200 on a degraded payload.
      #
      # §10.5b REVERTED, 2026-09-19 late night: this gate is back on every event
      # (pull_request and push alike), and PRs carry these files again. §10.5b's
      # premise -- a post-merge job on `main` regenerates and commits, so PRs don't
      # need to -- assumed a GITHUB_TOKEN commit could actually reach a
      # branch-protected `main`. It cannot: `main` has `enforce_admins: true` with 9
      # required status checks, and a brand-new bot commit has zero check runs
      # against it, so every push from regen-generated-docs.yml is rejected with
      # "9 of 9 required status checks are expected" -- discovered live when #289
      # merged without its docs (the first real non-empty diff since §10.5b landed)
      # and the push failed. No token fixes this; the only way a commit reaches a
      # protected branch with required checks is a normal PR merge or a PAT-driven
      # PR + human-triggered checks (refresh-lock.yml's own documented limitation).
      # Reverted to requiring current docs at the PR gate instead of building that
      # PAT flow under pressure. doc-drift-nightly.yml stays -- independently
      # valuable (it is what caught this drift going unfixed), and regen-generated-
      # docs.yml stays as a redundant, self-verifying safety net that now correctly
      # fails loud instead of silently reporting success when its push is rejected.
      - name: Engine figures are current (D-GEN gate)
        run: |
          python scripts/gen_engine_figures.py --repo . --baseline HEAD             --out docs/_generated/engine_figures.md --check

      # Q-4 step 2. `schema.sql` is now the reviewable source; `schema_bootstrap.sql` and
      # `schema_runtime.sql` are GENERATED from it and are what connect() actually executes.
      # If someone edits schema.sql and forgets to regenerate, the running system quietly
      # stops matching the file everyone reviews -- the same failure mode as the stale
      # engine figures above, with a much worse blast radius.
      #
      # Unlike the figures generator this reads the WORKING TREE, so no `git add` ordering
      # trap.
      - name: Schema halves match schema.sql (Q-4 gate)
        run: python scripts/split_schema.py --check

      # TDL-6: was DEFERRED (continue-on-error) because pip-tools 7.4.1 crashed on the runner's
      # pip ("'PackageFinder' object has no attribute 'allow_all_prereleases'") and the lock was
      # Python-3.10-compiled while CI runs 3.11. Both fixed: pip-tools 7.6.1 + lock regenerated.
      # Now BLOCKING — a stale lock is how the aiosmtplib CVE stayed pinned after the fix landed.
      #
      # 🔴 2026-09-08: the lock was compiled under 3.11 to match THIS RUNNER, which is the wrong
      # invariant. The runtime image is python:3.12-slim-bookworm (deploy/multiuser/Dockerfile),
      # so a 3.11-resolved lock cannot represent what production installs: every distribution
      # requiring >=3.12 is invisible to it. numpy 2.5.3 and scipy 1.18.1 both declare
      # Requires-Python >=3.12, and the deployed containers run them, while a 3.11 resolve of the
      # same requirements.txt caps out at numpy 2.4.6 / scipy 1.17.1. Reproducible-in-CI is not
      # the goal; representative-of-production is. Pinned to the runtime's Python below.
      #
      # Keep this in step with `.github/workflows/refresh-lock.yml` and with the Dockerfile's
      # base image. If they diverge again, the gate goes permanently red or permanently blind.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify requirements.lock is current
        run: |
          pip install pip-tools==7.6.1
          python scripts/compile_requirements.py
          git diff --exit-code requirements.lock

      # Nothing built an image in CI, so a base-image change or an un-installable pin
      # passed green by default -- #104/#105 bumped python 3.12->3.14 and collected nine
      # green checks having never constructed an image. A full build does not fit a
      # runner (the runtime image is ~6.3 GB before the wheel cache), so these two steps
      # gate the parts that actually broke instead.
      - name: Python platform coupling (runtime image = lock = matrix)
        run: python scripts/check_python_platform_coupling.py

      - name: Every locked pin installs on the runtime's Python
        # Metadata-only: proves each exact pin has a distribution for this Python and
        # platform, without downloading torch. Catches "this dependency cannot install
        # here", which is the failure a base-image bump actually causes.
        run: pip install --dry-run --no-deps -r requirements.lock

  test:
    name: Pytest (unit, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Wave T-3 / TDL-8: Three-tier test execution model:
      # 1. Fast unit tier (this job): Matrixed across Python 3.10, 3.11 and 3.12.
      #    3.10 is the declared requires-python = ">=3.10" floor (TDL-8), enforced at
      #    import/compile time. 🔴 3.12 is the CEILING and it is the one that was missing:
      #    the runtime image is python:3.12-slim-bookworm, so until 2026-09-08 the
      #    interpreter production actually runs was the ONLY one never tested. The floor
      #    had a matrix entry; the deployed version had none.
      #    Excludes integration, perf, and live-tier multi-engine scenarios.
      # 2. Integration tier: DB-backed suites against Postgres and Redis running on
      #    Python 3.11 only to avoid multiplying service container runtimes.
      # 3. Live tier: Nightly Golden Thread (I-7) against the live stack in
      #    .github/workflows/nightly-golden-thread.yml rather than in the PR path.
      #
      # Keep the top of this range equal to the Dockerfile's base image. TDL-8's original
      # failure was a declaration nothing asserted (`from datetime import UTC`, 3.11+, in
      # production code, on a green CI); testing only the floor reproduces that shape at
      # the other end of the range.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          # CI has no GPU. torch is pinned >=2.13.0 and floated to 2.14.0, whose
          # default wheels pull nvidia_cudnn_cu13 (553 MB), nvidia_nccl_cu13
          # (216 MB) and triton (248 MB) on top of torch itself (555 MB) -- about
          # 3.2 GB of downloads, which exhausts the runner disk (ENOSPC). The CPU
          # index drops the CUDA wheels entirely; nothing here runs on a GPU.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest (exclude integration)
        env:
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          DROPBOX_APP_SECRET: test-dropbox-secret
          GRAPH_CLIENT_STATE: test-graph-state
          DRIVE_CHANNEL_TOKEN: test-drive-token
          MINIO_ACCESS_KEY: test-minio-access-key
          MINIO_SECRET_KEY: test-minio-secret-key
        # Wave T-3: Exclude integration, perf, and live-tier scenarios.
        # Golden Thread multi-engine scenario runs nightly against the live stack.
        #
        # §10.5b REVERTED, 2026-09-19 late night: doc_gate is no longer excluded here
        # -- these 4 tests (docs/API.md, openapi.json, docs/_generated/surface.md,
        # docs/_generated/host_parity.md currency) run on every PR and push again,
        # same as before §10.5b. §10.5b's post-merge-regen-instead-of-PR-carries-docs
        # design assumed a GITHUB_TOKEN commit could reach `main`; it cannot, because
        # `main` requires 9 status checks even for direct pushes
        # (`enforce_admins: true`) and a fresh bot commit has none. Discovered live
        # when #289 merged without its docs and regen-generated-docs.yml's push was
        # rejected -- worse, the job's own error handling treated the rejection as
        # the documented benign race and reported success, so the drift went
        # uncorrected AND unflagged until doc-drift-nightly.yml would have caught it
        # at 04:30 UTC. Reverted PRs to carrying current docs rather than build a
        # PAT-driven auto-merge flow under pressure (see ci.yml's D-GEN gate comment
        # for the same reasoning). doc_gate marker itself is unchanged and still used
        # by doc-drift-nightly.yml's own standalone `pytest -m doc_gate` invocation.
        run: pytest tests/ -m "not integration and not perf and not live" -q --tb=short

      - name: Empty with-block gate
        run: python scripts/check_empty_with.py

  security:
    name: Security & IaC validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit==1.8.3 pip-audit==2.9.0

      - name: Bandit (high severity)
        # --severity-level high matches this step's declared intent; -ll
        # (medium+) fails on ~80 B608 string-SQL findings in namespace-scoped
        # query builders that are individually reviewed in-wave. Medium-level
        # triage is tracked as TDL backlog, not a merge gate.
        run: bandit -r nce server.py admin_server.py --severity-level high -q

      - name: pip-audit (requirements)
        # Let pip-audit resolve the requirements in its isolated venv and
        # audit the actual resolved versions. The previous --disable-pip
        # invocation exits 2 under pip-audit 2.9.0 (CLI usage error), and
        # --no-deps additionally demands exact == pins while
        # requirements.txt deliberately uses >= ranges.
        run: pip-audit -r requirements.txt --strict

      - uses: hashicorp/setup-terraform@v4
        with:
          # 1.6.0's bundled release-signing keyring has expired — provider
          # install dies with "openpgp: key expired" during init. Track
          # latest: this job only runs `terraform validate`.
          terraform_version: "latest"

      - name: Terraform validate (GCP)
        working-directory: trimcp-infra/gcp
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform validate (AWS)
        working-directory: trimcp-infra/aws
        run: |
          terraform init -backend=false
          terraform validate

      - name: Docker Compose config validate
        env:
          # docker-compose.yml uses ${REDIS_PASSWORD:?...} required
          # interpolation; config validation only needs A value, not the
          # real secret.
          REDIS_PASSWORD: ci-config-validate-dummy
        # The env_file entries are gitignored deploy-local files — seed them
        # from the tracked example so config validation can resolve them.
        run: |
          cp deploy/compose.stack.env.example deploy/compose.stack.env
          touch deploy/compose.stack.env.generated
          docker compose -f docker-compose.yml config --quiet

  integration:
    name: Pytest (integration smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mcp_user
          POSTGRES_PASSWORD: mcp_password
          POSTGRES_DB: memory_meta
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U mcp_user -d memory_meta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # Redis for the M6 System Design cache-invalidation tests, which need
      # Postgres AND Redis in the same job: they author through the real cores
      # (so they need the pool and namespace fixtures) and then assert the cached
      # read path serves fresh data (so they need a real Redis -- a mock stores
      # nothing and cannot detect staleness). The dedicated cache-invalidation
      # job cannot host them; it has no Postgres.
      #
      # Deliberately published on 6380, NOT the default 6379. A `services:` block
      # is job-wide, so binding the default port would put a reachable Redis
      # under every other step here and silently flip any test that currently
      # takes a Redis-absent fallback path -- the exact objection that kept the
      # cache-invalidation job separate. On 6380 the ambient default
      # (redis://localhost:6379/0) still finds nothing, and only the step that
      # sets NCE_TEST_REDIS_URL explicitly can reach it.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6380:6379
          # Host ports 15432/16379 (and this 6380) are deliberately NOT the
          # service's own port. On a SELF-HOSTED runner under WSL2, Windows'
          # localhost is forwarded into the distro, so the developer stack's
          # Docker Desktop publishes of 5432/6379 are already bound and the
          # service container fails with "address already in use" before any
          # test runs. Hosted runners do not care which host port is used.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          # CI has no GPU. torch is pinned >=2.13.0 and floated to 2.14.0, whose
          # default wheels pull nvidia_cudnn_cu13 (553 MB), nvidia_nccl_cu13
          # (216 MB) and triton (248 MB) on top of torch itself (555 MB) -- about
          # 3.2 GB of downloads, which exhausts the runner disk (ENOSPC). The CPU
          # index drops the CUDA wheels entirely; nothing here runs on a GPU.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply Postgres schema
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        run: python scripts/apply_integration_schema.py

      # Q-4 step 1. connect() runs TWO schema writers (orchestrator.py:205-206): the whole
      # of schema.sql, then the numbered migration chain. schema.sql is not a dead second
      # writer -- its unguarded ADD COLUMNs sit inside DO $$ blocks that probe
      # information_schema first, so it detects missing columns and adds them on every
      # connect. It is a migration runner that keeps no ledger.
      #
      # Measured on the live database 2026-09-17: applied_migrations held 74 rows (max 078)
      # while all ten schema.sql-only columns were present and unrecorded.
      #
      # This step asserts the integration database -- built by apply_integration_schema.py
      # from schema.sql plus every migration -- has everything schema.sql guarantees. It is
      # the interlock for step 2: once _init_pg_schema is bootstrap-only, an existing
      # database stops receiving schema.sql-only DDL, so "nothing is reachable only through
      # schema.sql" has to be a checked property rather than a belief.
      #
      # Proven in both directions before wiring (a checker that cannot go red is the defect
      # it is meant to catch):
      #   fresh DB from schema.sql alone       -> 0 missing tables, 0 missing columns
      #   live DB (image predates migration 079) -> found system_design_geometry.node_geometry_label
      #   after DROP COLUMN + DROP TABLE       -> reported exactly those two
      - name: Schema drift — the DB has everything schema.sql guarantees (Q-4)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
        run: python scripts/check_schema_drift.py --dsn "$PG_DSN"

      - name: Integration smoke (RLS, schema, event log, outbox)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: |
          pytest tests/test_rls_isolation_integration.py \
            tests/test_schema_bootstrap.py \
            tests/test_rls_catalog.py \
            tests/test_outbox_relay.py \
            tests/test_outbox_fanout.py \
            tests/test_event_log_hardening.py \
            tests/test_node_ownership_seed_bulk.py \
            tests/test_namespace_fk_cascade.py \
            tests/test_namespace_fixture_teardown.py \
            tests/test_sales_signed_baselines_key.py \
            tests/test_worm_registry.py::test_memory_salience_not_in_worm_tables \
            tests/test_worm_registry.py::test_worm_tables_contains_expected_entries \
            -m integration -q --tb=short

      # ML-CI1 (2026-09-16): security-shaped suites that ran in NO workflow.
      # KNOWN_UNWIRED held 110 files; 13 of them assert security controls -- IDOR,
      # session fixation, prompt injection, external-scope RLS, WORM enforcement,
      # PII sanitisation. "The control exists" was an unbacked claim for all of
      # them: the code was there and nothing ever executed it.
      #
      # These eight are wired here because they pass against the CI service
      # Postgres with no further dependencies. Measured 2026-09-16: 30 passed.
      # The remaining five are NOT wired yet, each for a stated reason:
      #   test_governed_decorator.py        -- contract conflict with Wave B-B128
      #                                        (@governed now requires conn +
      #                                        namespace_id; the test passes None).
      #                                        Routed to MLV15B, not silenced here.
      #   test_cron_chain_verify.py         -- needs Redis (this job's Redis is on
      #   test_chain_and_decay_integration.py  6380 and deliberately not ambient)
      #   test_sales_sign_to_project.py     -- needs MinIO credentials
      #   test_batch49_pii_derivation.py    -- needs MinIO credentials
      # Removing a file from KNOWN_UNWIRED without wiring it would be worse than
      # leaving it: the list is the only record of what is unguarded.
      # RL-H18 / migration 080. A row trigger cannot fire on TRUNCATE, so the WORM
      # guard could be bypassed in one statement. Wired here on the same principle
      # as ML-CI1: a security test that runs in no workflow is not a control.
      - name: Integration — WORM TRUNCATE guard (RL-H18)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/test_worm_truncate_guard.py -m integration -q --tb=short

      # Q-12 (ML-CI1). These three were in KNOWN_UNWIRED -- 10 integration tests over the
      # actor-trust ledger, event-log concurrency and event-log chain verification, running
      # in zero workflows. Their pass/fail had never been observed by anything.
      #
      # They were not unwirable, they were SKIPPED: each needs an active row in
      # `signing_keys`, and the fixture refuses to seed one unless
      # NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL is set -- because seeding writes a key
      # encrypted with the current shell's master key and would orphan a real deployment.
      # CI's database is disposable and recreated per run, which is exactly the case that
      # guard's own message permits. Same env as every other integration step here.
      #
      # Verified against a real Postgres built by apply_integration_schema.py before wiring:
      #   test_actor_trust            7 passed
      #   test_event_log_concurrency  2 passed
      #   test_event_log_verification 1 passed
      #
      # 🔴 Deliberately NOT added here, each with a measured reason:
      #   test_governed_decorator            - test_governed_pending_does_not_touch_db FAILS.
      #       Real regression from B-B128: @governed now requires conn + namespace_id and the
      #       test passes None. Routed to MLV15B. Wiring it would put a known break in CI.
      #   test_envelope_read_consumers       - skips, needs an isolated stack on PG:5433 /
      #       Mongo:27018 / Redis:6380 that this job does not provide.
      #   test_envelope_encryption_integration, test_batch49_pii_derivation
      #                                      - need a real MinIO; setting MINIO_ACCESS_KEY
      #       alone still errors after ~65s of connection attempts.
      - name: Integration — trust ledger, event-log concurrency & chain verify (Q-12)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: >-
          pytest
          tests/test_actor_trust.py
          tests/test_event_log_concurrency.py
          tests/test_event_log_verification.py
          -m integration -q --tb=short

      # RL-H21 — `test_health_probes.py` was in KNOWN_UNWIRED because its verdict depended
      # on run count. `test_check_health_integration_healthy` called check_health()
      # UNSCOPED, so it asserted a property of the WHOLE DATABASE: that no namespace
      # anywhere has a broken Merkle chain. Any other test leaving a corrupt chain -- in a
      # namespace it never touched -- failed it. Measured: passes 3/3 alone, fails after 68
      # other files have run, reporting event_seq=42 from a namespace it never created.
      #
      # Its sibling `test_check_health_integration_corrupted_chain` had always scoped the
      # namespace scan. The two were simply asymmetric; the healthy one now does the same.
      #
      # Safe to run here despite this job sharing one database, which is the whole point.
      # Mutation-proven with a deliberately corrupted chain in an unrelated namespace:
      #   fixed test   + pollution -> passes
      #   unfixed test + pollution -> fails ("corrupted" != "valid")
      #   tamper sibling           -> still detects corruption
      - name: Integration — health probes (RL-H21)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: pytest tests/test_health_probes.py -m integration -q --tb=short

      # Q-12 (ML-CI1) — the bulk wiring. 68 test files that ran in ZERO workflows now run here.
      #
      # These were not new tests and not broken ones: they were simply never invoked. Census
      # taken 2026-09-17 against a database built by apply_integration_schema.py, running
      # every one of the 99 files still in KNOWN_UNWIRED:
      #
      #     pass cleanly   72        fail  14        error 3        all-skipped 6
      #
      # 🔴 The 72 was then re-verified with MONGO_URI pointed at a dead port, because THIS JOB
      # HAS NO MONGO SERVICE -- only postgres and redis. Four of the 72 passed only because the
      # measuring machine happened to have Mongo on 27017:
      #     test_explain_past_decision, test_replay_handlers_integration,
      #     test_vendors_registry, and one pass+skip case (test_garbage_collector, kept -- its
      #     single skip is unrelated to Mongo).
      # Wiring those four would have turned main red on the first run. 68 survive and are wired.
      #
      # The 14 that FAIL are deliberately NOT wired. They are tracked as their own finding: a
      # test that fails where nothing observes it is the same defect class as B-B128, which
      # merged clean because its test ran in no workflow. They need triage, not silencing.
      #
      # Grouped by theme so a future red names its own area rather than one 68-file blob.

      - name: Integration — agreements, procurement & vendors (Q-12)
        env:
          PG_DSN: postgresql://mcp_user:mcp_password@localhost:15432/memory_meta
          NCE_MASTER_KEY: ci-test-master-key-32chars-minimum!!
          NCE_INTEGRATION_REFRESH_SIGNING_ON_DECRYPT_FAIL: "1"
        run: >-
          pytest
          tests/test_agreements_coverage.py
          tests/test_agreements_extract.py
          tests/test_agreements_graph.py
          tests/test_agreements_kickback.py
          tests/test_agreements_review.py
          tests/test_procurement_bids.py
          tests/test_procurement_frontier.py
          tests/test_procurement_generate_po.py
          tests/test_procurement_graph.py
          tests/test_procurement_recalibration.py
          tests/test_procurement_submit_po.py
          tests/test_vendors_contractor_match.py
          tests/test_vendors_frontier.py
          tests/test_vendors_partner_view.py
          tests/test_vendors_performance.py
          tests/test_vendors_procurement_feed.py
          tests/test_vendors_scorecard.py
          tests/test_vendors_tiers.py
          -m integration -q --tb=short

      - name: Integration — product, sales & project (Q-12)
        env:
