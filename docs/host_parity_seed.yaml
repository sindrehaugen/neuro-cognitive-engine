# Host-parity seed (H-2, charter MLV16_ORCH_CHARTER_2026-09-18.md §9 "Lane H").
#
# Hand-authored, checked-in source of record for scripts/gen_portal_parity.py,
# which renders docs/_generated/host_parity.md from this file. Do not hand-edit
# the generated file; edit this seed and regenerate.
#
# GENERIC NAMES ONLY. No host product, company, or module/schema name may appear
# in this file, its generator, or the file it generates -- every family below is
# named and described purely by the business capability it covers, translated
# from the (private, external-to-this-tree) v1.6 analysis's own disposition
# table. NCE's own existing identifiers (tool names, routes) ARE named, since
# those belong to this tree already.
#
# disposition is one of:
#   MOVE   - an NCE engine already owns the concept; port the capability
#   MOVE+  - an NCE engine owns the concept but the capability itself is new
#   NEW    - no engine covers it; a new shared-core or capability
#   HOST   - stays outside NCE (identity, per-user UI state)
#   RETIRE - a mirrored/duplicated store that an NCE-owned store replaces after backfill
#   FEED   - becomes a read-only data-feed adapter module, not engine business logic
#
# A family with no disposition is a RED finding (see the generator's validation).
# replacing_route is required for MOVE/MOVE+ rows (an existing or planned NCE
# route/tool identifier); optional and typically empty for the other dispositions.

