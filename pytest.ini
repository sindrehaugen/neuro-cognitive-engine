[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    integration: requires Postgres or other external runtime (skipped in unit-only runs)
    signing_isolation: forces clearing of the signing key cache after the test
    heavy: marks tests that load heavy ML models (SentenceTransformer, spaCy, CrossEncoder, OpenVINO) to allow deselecting them
    perf: OL measurement-harness benchmarks; only run with `pytest -m perf` (excluded from default collection)
    real_mcp_auth: opts a test out of the autouse fixture that injects MCP API credentials, so it can observe the real missing-credential rejection
# Starlette TestClient + async HMAC middleware: strict unraisable hook reports
# benign socket/event-loop teardown noise on Windows as ExceptionGroup failures.
# Resource hygiene for those tests is tracked separately; deprecations still fail.
addopts = -p no:unraisableexception -W ignore::DeprecationWarning --timeout=60 -m "not perf"
# Prompt 28: PytestRemovedIn9Warning-proofing — explicit loop scope prevents
# warnings when using shared event loops across async fixtures.
filterwarnings =
    ignore::ResourceWarning
    # Fail the suite on any other warning.
    error
    # starlette's TestClient emits a deprecation ("install httpx2 instead") in current releases;
    # it is NOT a DeprecationWarning subclass so -W above misses it. Matched by MESSAGE (not class)
    # so the filter is valid even on starlette versions where the warning class is absent.
    # Listed last so it wins over `error` (pytest applies later filters with higher priority). See #23.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
